<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bolão — Lançar Resultados</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-0:#060b16; --bg-1:#0a1424; --text:#eaf1fd; --muted:#8ba1c4; --faint:#56688a;
      --line:rgba(255,255,255,.08); --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.08);
      --green:#16d488; --green-d:#0fae6e; --amber:#ffb23e; --red:#ff5a6a; --accent:#3b82f6;
      --shadow:0 18px 50px -12px rgba(0,0,0,.6);
    }
    html { -webkit-text-size-adjust:100%; }
    body { background:var(--bg-0); color:var(--text); min-height:100vh;
      font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
    body::before { content:""; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(1000px 560px at 10% -10%, rgba(59,130,246,.22), transparent 60%),
        radial-gradient(800px 560px at 100% 0%, rgba(22,212,136,.14), transparent 55%),
        linear-gradient(180deg,var(--bg-1),var(--bg-0)); }
    .wrap { max-width:640px; margin:0 auto; padding:0 clamp(.8rem,4vw,1.4rem) 2.5rem; }

    header { position:sticky; top:0; z-index:20;
      backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
      background:linear-gradient(180deg,rgba(8,15,28,.86),rgba(8,15,28,.55));
      border-bottom:1px solid var(--line); }
    .head-inner { max-width:640px; margin:0 auto; padding:.9rem clamp(.8rem,4vw,1.4rem);
      display:flex; align-items:center; justify-content:space-between; gap:.6rem; }
    .brand { display:flex; align-items:center; gap:.7rem; }
    .brand .logo { width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
      font-size:1.2rem; background:linear-gradient(145deg,#14233f,#0c1830); border:1px solid var(--line); }
    .brand h1 { font-size:1.1rem; font-weight:800; line-height:1.05; }
    .brand h1 span { display:block; font-size:.64rem; font-weight:700; letter-spacing:.2em;
      text-transform:uppercase;
      background:linear-gradient(90deg,var(--green),#7be8bf); -webkit-background-clip:text;
      background-clip:text; color:transparent; }
    .back { color:var(--muted); text-decoration:none; font-size:.8rem; font-weight:600;
      border:1px solid var(--line); padding:.45rem .8rem; border-radius:999px; white-space:nowrap; }
    .back:hover { background:var(--glass-2); color:var(--text); }

    .intro { color:var(--muted); font-size:.85rem; margin:1.1rem 0 .4rem; text-align:center; }

    .game { background:var(--glass); border:1px solid var(--line); border-radius:16px;
      padding:.9rem; margin-top:.7rem; box-shadow:var(--shadow); animation:rise .3s ease both; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } }
    .game-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:.6rem; }
    .game-head .t { font-weight:800; font-size:1rem; }
    .game-head .cur { font-size:.72rem; font-weight:700; color:var(--faint);
      padding:.2rem .55rem; border-radius:999px; border:1px solid var(--line); }
    .game-head .cur.set { color:#04140d; }

    .opts { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
    .opt { border:1px solid var(--line); background:var(--glass); color:var(--text);
      border-radius:12px; min-height:52px; font-size:1rem; font-weight:800; cursor:pointer;
      transition:transform .12s ease, background .2s ease, border-color .2s ease;
      display:flex; align-items:center; justify-content:center; }
    .opt:hover { background:var(--glass-2); }
    .opt:active { transform:scale(.97); }
    .opt.on.casa   { background:linear-gradient(145deg,var(--green),var(--green-d)); color:#04140d; border-color:transparent; }
    .opt.on.empate { background:linear-gradient(145deg,#ffc766,var(--amber)); color:#241400; border-color:transparent; }
    .opt.on.fora   { background:linear-gradient(145deg,#ff7b88,var(--red)); color:#2a0409; border-color:transparent; }

    .anular { margin-top:.5rem; text-align:center; }
    .anular button { background:none; border:none; color:var(--faint); font-size:.78rem;
      font-weight:700; cursor:pointer; padding:.35rem .7rem; border-radius:999px; }
    .anular button:hover { background:var(--glass); color:var(--muted); }
    .anular button.on { color:var(--muted); background:var(--glass-2); }

    #toast { position:fixed; left:50%; bottom:1.3rem; transform:translateX(-50%) translateY(20px);
      background:linear-gradient(145deg,var(--green),var(--green-d)); color:#04140d;
      font-weight:800; padding:.7rem 1.2rem; border-radius:999px; box-shadow:var(--shadow);
      opacity:0; pointer-events:none; transition:all .3s ease; font-size:.9rem; z-index:50; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    .live { display:inline-flex; align-items:center; gap:.4rem; font-size:.7rem; font-weight:700;
      letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:1rem; justify-content:center; width:100%; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--faint); }
    .dot.on { background:var(--green); }
  </style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <div class="logo">⚙️</div>
      <h1>Resultados<span>Lançar pelo celular</span></h1>
    </div>
    <a class="back" href="/">🏆 Ranking</a>
  </div>
</header>

<div class="wrap">
  <p class="intro">Toque no resultado de cada jogo — salva na hora e atualiza o ranking ao vivo.</p>
  <div id="games">Carregando…</div>
  <div class="live"><span class="dot" id="dot"></span><span id="conn">conectando…</span></div>
</div>

<div id="toast"></div>

<script>
const LABELS = ["Casa","Empate","Fora"];
const CLASSES = ["casa","empate","fora"];
const ANNULLED = 3;
let official = {};

function render(){
  const c = document.getElementById("games");
  c.innerHTML = "";
  for (let g=0; g<8; g++){
    const cur = official[g];
    const curTxt = cur===undefined ? "—" : (cur===ANNULLED ? "Anulado" : LABELS[cur]);
    const curCls = cur===undefined ? "" : (cur===ANNULLED ? "set" : "set "+CLASSES[cur]);
    const curStyle = cur!==undefined && cur!==ANNULLED
      ? `background:var(--${cur===0?'green':cur===1?'amber':'red'})` : (cur===ANNULLED?'background:var(--muted)':'');
    const div = document.createElement("div");
    div.className = "game";
    div.innerHTML = `
      <div class="game-head">
        <span class="t">Jogo ${g+1}</span>
        <span class="cur ${curCls}" style="${curStyle}">${curTxt}</span>
      </div>
      <div class="opts">
        ${[0,1,2].map(o=>`<button class="opt ${CLASSES[o]} ${cur===o?'on':''}" onclick="setResult(${g},${o})">${LABELS[o]}</button>`).join("")}
      </div>
      <div class="anular"><button class="${cur===ANNULLED?'on':''}" onclick="setResult(${g},${ANNULLED})">🚫 Anular jogo</button></div>`;
    c.appendChild(div);
  }
}

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove("show"),1800);
}

function setResult(game, result){
  fetch("/api/results",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({game,result})})
    .then(r=>r.json()).then(d=>{
      if(d.ok){ official[game]=result; render();
        toast(`Jogo ${game+1}: ${result===ANNULLED?"Anulado":LABELS[result]} ✓`); }
      else toast("Erro ao salvar");
    }).catch(()=>toast("Erro ao salvar"));
}

// live sync (reflects results set from other devices / the desktop app)
function connectSSE(){
  const es=new EventSource("/stream");
  es.onopen=()=>{ dot.className="dot on"; conn.textContent="ao vivo"; };
  es.onerror=()=>{ dot.className="dot"; conn.textContent="reconectando…"; };
  es.onmessage=(e)=>{ const d=JSON.parse(e.data);
    if(d.type==="ranking" && d.official){ official={}; Object.entries(d.official).forEach(([k,v])=>official[parseInt(k)]=v); render(); } };
}

fetch("/api/results").then(r=>r.json())
  .then(d=>{ Object.entries(d).forEach(([k,v])=>official[parseInt(k)]=v); render(); })
  .catch(()=>render());
connectSSE();
</script>
</body>
</html>
